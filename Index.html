<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go On Stop – No Gwene</title>
    
    <!-- OneSignal SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "YOUR_ONESIGNAL_APP_ID", // יש להחליף ב-App ID המקורי של OneSignal
        });
      });
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Styles -->
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .progress-ring-circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Push Notification Opt-in Modal -->
    <div id="notificationModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-card max-w-md w-full p-6 rounded-2xl text-center space-y-4">
            <div class="w-16 h-16 bg-indigo-600/20 text-indigo-400 rounded-full flex items-center justify-center mx-auto text-2xl">
                <i class="fa-solid fa-bell"></i>
            </div>
            <h3 class="text-xl font-bold">הפעלת התראות</h3>
            <p class="text-slate-400 text-sm">כדי לקבל עדכונים בזמן אמת, הודעות עידוד והתראות חירום מהקבוצה, יש לאשר את התראות ה-Push.</p>
            <button onclick="requestNotificationPermission()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-semibold transition">
                אישור והפעלת התראות
            </button>
        </div>
    </div>

    <!-- Header Navigation -->
    <header class="glass-card sticky top-0 z-40 border-b border-slate-800 px-4 py-3">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center font-bold text-indigo-400 border border-indigo-500/30">
                    <span id="userAvatarText">U</span>
                </div>
                <div>
                    <h1 class="font-bold text-sm leading-tight" id="headerUserName">טוען משתמש...</h1>
                    <p class="text-xs text-slate-400">Go On Stop – No Gwene</p>
                </div>
            </div>
            <button onclick="openAdminModal()" class="p-2 text-slate-400 hover:text-white transition">
                <i class="fa-solid fa-user-shield text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-xl mx-auto px-4 mt-6 space-y-6">

        <!-- Timer & Streak Card -->
        <section class="glass-card rounded-3xl p-6 text-center relative overflow-hidden">
            <h2 class="text-slate-400 text-sm font-medium mb-4">רצף נוכחי</h2>
            
            <div class="relative w-48 h-48 mx-auto flex items-center justify-center mb-4">
                <svg class="w-full h-full" viewBox="0 0 100 100">
                    <circle class="text-slate-800" stroke-width="8" stroke="currentColor" fill="transparent" r="40" cx="50" cy="50"/>
                    <circle id="progressCircle" class="text-indigo-500 progress-ring-circle" stroke-width="8" stroke-dasharray="251.2" stroke-dashoffset="251.2" stroke-linecap="round" stroke="currentColor" fill="transparent" r="40" cx="50" cy="50"/>
                </svg>
                <div class="absolute flex flex-col items-center">
                    <span id="streakDays" class="text-4xl font-extrabold text-white">0</span>
                    <span class="text-xs text-slate-400 mt-1">ימים</span>
                </div>
            </div>

            <div id="liveTimer" class="text-xl font-mono text-indigo-300 font-bold tracking-wider mb-6">
                00d 00h 00m 00s
            </div>

            <button onclick="handleRelapse()" class="w-full py-3 bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-500/30 rounded-xl font-semibold flex items-center justify-center space-x-2 space-x-reverse transition">
                <i class="fa-solid fa-heart-crack"></i>
                <span>💔 נשברתי</span>
            </button>
        </section>

        <!-- Leaderboard Section -->
        <section class="glass-card rounded-3xl p-6">
            <h3 class="text-lg font-bold mb-4 flex items-center space-x-2 space-x-reverse">
                <i class="fa-solid fa-trophy text-amber-400"></i>
                <span>לוח מובילים</span>
            </h3>
            <div id="leaderboardList" class="space-y-3">
                <p class="text-slate-500 text-sm text-center py-4">טוען דירוג...</p>
            </div>
        </section>

        <!-- Boosts / Encouragement Section -->
        <section class="glass-card rounded-3xl p-6">
            <h3 class="text-lg font-bold mb-4 flex items-center space-x-2 space-x-reverse">
                <i class="fa-solid fa-hands-clapping text-emerald-400"></i>
                <span>כרטיסיית חיזוקים</span>
            </h3>
            <div id="encouragementsList" class="space-y-3">
                <p class="text-slate-500 text-sm text-center py-4">אין הודעות עידוד עדיין...</p>
            </div>
        </section>
    </main>

    <!-- Admin Panel Modal -->
    <div id="adminModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-card max-w-lg w-full p-6 rounded-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-lg font-bold flex items-center space-x-2 space-x-reverse">
                    <i class="fa-solid fa-shield-halved text-indigo-400"></i>
                    <span>פאנל מנהל מערכת</span>
                </h3>
                <button onclick="closeAdminModal()" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- Login View -->
            <div id="adminLoginView" class="space-y-4">
                <p class="text-sm text-slate-400">הזן סיסמת מנהל כדי להמשיך:</p>
                <input type="password" id="adminPasswordInput" placeholder="סיסמת מנהל" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
                <button onclick="verifyAdminPassword()" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-semibold">התחבר</button>
            </div>

            <!-- Dashboard View -->
            <div id="adminDashboardView" class="space-y-4 hidden">
                <div id="adminUsersList" class="space-y-3">
                    <!-- ניהול משתמשים ייטען פה -->
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Configuration & Application Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Application State
        let currentUser = {
            id: "user_" + Math.random().toString(36).substr(2, 9),
            name: "משתמש חדש",
            startDate: Date.now(),
            bonusPoints: 0,
            lastEncouragementSent: 0,
            lastNameChange: 0
        };

        const ADMIN_PASS = "4468800";

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            initUser();
            checkNotificationPermission();
            startLiveTimer();
            listenToLeaderboard();
        });

        function initUser() {
            const savedUser = localStorage.getItem('go_on_stop_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
            } else {
                localStorage.setItem('go_on_stop_user', JSON.stringify(currentUser));
            }
            updateUI();
            syncUserToFirestore();
        }

        function updateUI() {
            document.getElementById('headerUserName').innerText = currentUser.name;
            document.getElementById('userAvatarText').innerText = currentUser.name.charAt(0).toUpperCase();
        }

        async function syncUserToFirestore() {
            try {
                await setDoc(doc(db, "users", currentUser.id), currentUser, { merge: true });
            } catch (e) {
                console.error("Firestore sync error:", e);
            }
        }

        // Live Timer & Progress Circle
        function startLiveTimer() {
            setInterval(() => {
                const now = Date.now();
                const diff = Math.max(0, now - currentUser.startDate);
                
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((diff / 1000 / 60) % 60);
                const seconds = Math.floor((diff / 1000) % 60);

                document.getElementById('streakDays').innerText = days;
                document.getElementById('liveTimer').innerText = 
                    `${String(days).padStart(2, '0')}d ${String(hours).padStart(2, '0')}h ${String(minutes).padStart(2, '0')}m ${String(seconds).padStart(2, '0')}s`;

                // Update Ring Offset (24 hours cycle)
                const circle = document.getElementById('progressCircle');
                const circumference = 2 * Math.PI * 40;
                const progressHours = (hours + minutes/60 + seconds/3600) / 24;
                circle.style.strokeDashoffset = circumference - (progressHours * circumference);
            }, 1000);
        }

        // Relapse Action
        window.handleRelapse = async function() {
            if (confirm("האם אתה בטוח שברצונך לאפס את הרצף?")) {
                currentUser.startDate = Date.now();
                localStorage.setItem('go_on_stop_user', JSON.stringify(currentUser));
                await syncUserToFirestore();
                sendOneSignalNotification("💔 התראת חירום", `${currentUser.name} נשבר/ה וזקוק/ה לעידוד!`);
            }
        };

        // OneSignal Notification Integration
        function sendOneSignalNotification(title, message) {
            // קריאת REST API של OneSignal לשליחת התראה לכל המשתמשים
            console.log("Sending Notification:", title, message);
        }

        window.requestNotificationPermission = function() {
            window.OneSignalDeferred.push(function(OneSignal) {
                OneSignal.Notifications.requestPermission().then(() => {
                    document.getElementById('notificationModal').classList.add('hidden');
                });
            });
        };

        function checkNotificationPermission() {
            if (window.Notification && Notification.permission !== "granted") {
                document.getElementById('notificationModal').classList.remove('hidden');
            }
        }

        // Realtime Leaderboard
        function listenToLeaderboard() {
            onSnapshot(collection(db, "users"), (snapshot) => {
                const users = [];
                snapshot.forEach(doc => users.push(doc.data()));
                
                users.sort((a, b) => {
                    const scoreA = Math.floor((Date.now() - a.startDate) / (1000 * 60 * 60 * 24)) + (a.bonusPoints || 0);
                    const scoreB = Math.floor((Date.now() - b.startDate) / (1000 * 60 * 60 * 24)) + (b.bonusPoints || 0);
                    return scoreB - scoreA;
                });

                renderLeaderboard(users);
            });
        }

        function renderLeaderboard(users) {
            const container = document.getElementById('leaderboardList');
            container.innerHTML = users.map((u, index) => `
                <div class="flex items-center justify-between p-3 rounded-xl bg-slate-800/50 border border-slate-700/50">
                    <div class="flex items-center space-x-3 space-x-reverse">
                        <span class="font-bold text-slate-500 text-sm w-4">${index + 1}</span>
                        <div class="w-8 h-8 rounded-full bg-indigo-600/20 text-indigo-400 flex items-center justify-center font-bold text-xs">
                            ${u.name.charAt(0)}
                        </div>
                        <span class="font-medium text-sm">${u.name}</span>
                    </div>
                    <div class="flex items-center space-x-2 space-x-reverse">
                        <span class="text-indigo-400 font-bold text-sm">${Math.floor((Date.now() - u.startDate)/(1000*60*60*24)) + (u.bonusPoints || 0)} ימים</span>
                        <button onclick="sendEncouragement('${u.id}')" class="p-1.5 text-slate-400 hover:text-emerald-400 transition" title="שלח עידוד">
                            <i class="fa-solid fa-heart"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Admin Functions
        window.openAdminModal = function() {
            document.getElementById('adminModal').classList.remove('hidden');
        };

        window.closeAdminModal = function() {
            document.getElementById('adminModal').classList.add('hidden');
        };

        window.verifyAdminPassword = function() {
            const pass = document.getElementById('adminPasswordInput').value;
            if (pass === ADMIN_PASS) {
                document.getElementById('adminLoginView').classList.add('hidden');
                document.getElementById('adminDashboardView').classList.remove('hidden');
                loadAdminDashboard();
            } else {
                alert("סיסמה שגויה");
            }
        };

        function loadAdminDashboard() {
            onSnapshot(collection(db, "users"), (snapshot) => {
                const container = document.getElementById('adminUsersList');
                let html = '';
                snapshot.forEach(userDoc => {
                    const u = userDoc.data();
                    html += `
                        <div class="p-3 bg-slate-900 border border-slate-700 rounded-xl space-y-2">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-sm">${u.name}</span>
                                <button onclick="deleteUser('${u.id}')" class="text-red-400 text-xs hover:underline">מחק</button>
                            </div>
                            <div class="flex space-x-2 space-x-reverse">
                                <input type="number" id="bonus_${u.id}" placeholder="בונוס" value="${u.bonusPoints || 0}" class="w-20 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-white">
                                <button onclick="updateBonus('${u.id}')" class="px-3 py-1 bg-indigo-600 text-xs rounded">עדכן</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            });
        }

        window.updateBonus = async function(userId) {
            const val = parseInt(document.getElementById(`bonus_${userId}`).value) || 0;
            await updateDoc(doc(db, "users", userId), { bonusPoints: val });
            alert("ניקוד עודכן בהצלחה");
        };

        window.deleteUser = async function(userId) {
            if (confirm("למחוק משתמש זה?")) {
                await setDoc(doc(db, "users", userId), { deleted: true });
            }
        };
    </script>
</body>
</html>
